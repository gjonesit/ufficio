<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel Jones | Official Website</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --primary: #0047FF;
            --dark: #001529;
            --accent: #E81C23;
            --white: #ffffff;
            --light-bg: #F8FAFC;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: var(--dark); line-height: 1.6; background: var(--white); overflow-x: hidden; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .section-padding { padding: 100px 0; }
        .title-huge { font-size: clamp(40px, 8vw, 80px); font-weight: 900; line-height: 0.85; text-transform: uppercase; letter-spacing: -3px; margin-bottom: 40px; }
        .text-outline { -webkit-text-stroke: 1.5px white; color: transparent; }

        /* --- NAVBAR --- */
        header { position: fixed; top: 0; width: 100%; height: 80px; display: flex; align-items: center; z-index: 2000; transition: 0.3s; color: white; }
        header.scrolled { background: var(--white); color: var(--dark); box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        nav { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 40px; }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { color: inherit; text-decoration: none; font-weight: 800; font-size: 12px; text-transform: uppercase; transition: 0.2s; }
        .nav-links a:hover { color: var(--accent); }
        .btn-social { background: var(--accent); color: white !important; padding: 10px 20px; border-radius: 4px; }
        .logo { font-weight: 900; font-size: 22px; line-height: 0.8; text-align: center; text-transform: uppercase; }

        /* --- HERO --- */
        .hero { position: relative; height: 100vh; display: flex; align-items: center; color: white; overflow: hidden; }
        /* Modificato da video a immagine di sfondo */
        .hero-bg { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; z-index: -1; transform: translate(-50%, -50%); object-fit: cover; filter: brightness(0.35); }
        
        .hero-content { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .hero-card { background: var(--primary); padding: 40px; width: 420px; border-left: 8px solid var(--accent); box-shadow: 15px 15px 0px var(--dark); }
        .btn-hero { width: 100%; background: var(--dark); color: white; border: none; padding: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; display: block; text-align: center; text-decoration: none; transition: 0.3s; }
        .btn-hero:hover { background: var(--white); color: var(--dark); }

        /* --- CHI SONO (BIO) --- */
        .about-flex { display: flex; gap: 60px; align-items: center; }
        .about-text { flex: 1; }
        .about-image { flex: 1; background: var(--dark); aspect-ratio: 4/5; position: relative; }
        .about-image img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .about-image::after { content: ''; position: absolute; top: 20px; left: 20px; width: 100%; height: 100%; border: 2px solid var(--primary); z-index: -1; }

        /* --- MAGAZINE / BLOG --- */
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px; }
        .blog-card { cursor: pointer; }
        .blog-img-box { width: 100%; height: 250px; overflow: hidden; margin-bottom: 20px; }
        .blog-img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .blog-card:hover img { transform: scale(1.05); }
        .blog-tag { background: var(--dark); color: white; font-size: 10px; padding: 4px 10px; font-weight: 900; text-transform: uppercase; display: inline-block; margin-bottom: 10px; }

        /* --- HQ (UFFICI) --- */
        .offices-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2px; background: #ddd; }
        .office-card { background: var(--white); padding: 40px; transition: 0.3s; }
        .office-card:hover { background: var(--primary); color: white; }
        .office-num { font-size: 14px; font-weight: 900; color: var(--accent); margin-bottom: 15px; display: block; }

        /* --- TRAILER --- */
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; }

        /* --- ROADMAP --- */
        .roadmap { background: var(--dark); color: white; }
        .roadmap-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 30px 0; display: flex; justify-content: space-between; align-items: center; }
        .status { font-weight: 900; font-size: 12px; padding: 5px 15px; border: 1px solid var(--accent); color: var(--accent); text-transform: uppercase; }

        footer { background: var(--dark); color: white; padding: 80px 0; text-align: center; }

        @media (max-width: 1024px) {
            .nav-links { display: none; }
            .hero-content, .about-flex { flex-direction: column; text-align: center; }
            .hero-card { width: 100%; margin-top: 30px; }
            .about-image { width: 100%; }
        }


        .timeline {
    position: relative;
    margin-top: 60px;
}

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            width: 4px;
            height: 100%;
            background: var(--primary);
            transform: translateX(-50%);
        }

        .timeline-item {
            width: 50%;
            padding: 20px 40px;
            position: relative;
        }

        .timeline-item:nth-child(odd) {
            left: 0;
            text-align: right;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
        }

        .timeline-content {
            background: var(--dark);
            color: white;
            padding: 20px;
            border-left: 5px solid var(--accent);
            box-shadow: 10px 10px 0 var(--primary);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            top: 30px;
            right: -10px;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            z-index: 1;
        }

        .timeline-item:nth-child(even)::before {
            left: -10px;
        }


        @media (max-width: 768px) {
            .timeline::before {
                left: 20px;
            }

            .timeline-item {
                width: 100%;
                padding-left: 60px;
                text-align: left !important;
                left: 0 !important;
            }

            .timeline-item::before {
                left: 10px !important;
                right: auto;
            }
        }
    </style>
</head>
<body>

    <header id="nav">
        <nav>
            <div class="nav-links">
                <a href="{{ site.url }}/about/">Chi Sono</a>
                <a href="{{ site.url }}/blog">Blogs</a>
                <a href="{{ site.url }}/#areetematiche">Aree Tematiche</a>
            </div>
            <div class="logo">Office of<br>GABRIEL  JONES</div>
            <div class="nav-links" style="justify-content: flex-end;">
                <a href="{{ site.url }}/amministrazione/">Amministrazione</a>
                <a href="{{ site.url }}/tv">Videos</a>
                <a href="{{ site.url }}/archives/" class="btn-social">Archives</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <img src="file:///C:/Users/user/Downloads/joneshero.png" alt="Background" class="hero-bg">
        
        <div class="container hero-content">
            <div class="hero-text">
                <h1 class="title-huge">GABRIEL<br><span class="text-outline">JONES</span><br>2026.</h1>
                <p style="font-size: 18px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700;">Faccio un po' di tutto</p>
            </div>
            <div class="hero-card">
                <h3 style="margin-bottom: 15px; font-weight: 900; text-transform: uppercase;">Last News</h3>
                <p style="margin-bottom: 25px; font-size: 14px; opacity: 0.9;">Video, news & molto altro! Dal 20 aprile 2026 l'ufficio si rivoluziona!</p>
                <a href="#chi-sono" class="btn-hero">Scopri di più</a>
            </div>
        </div>
    </section>

{{ content }}

    <footer>
        <div class="logo" style="font-size: 30px;">GABRIEL JONES</div>
        <p style="opacity: 0.3; font-size: 10px; margin-top: 40px;">By Bibliowin - DaJones. 2026</p>
    </footer>

    <script>
        lucide.createIcons();
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 50) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        });
    </script>
</body>
</html>
