<!-- =========================
     AVATAR CUSTOMIZER PANEL
========================= -->

<div class="gj-avatar-customizer">

    <div class="gj-customizer-header">

        <h2>
            <i class="fas fa-palette"></i>
            Personalizzazione Avatar
        </h2>

        <p>
            Personalizza la tua immagine profilo
            con effetti moderni e stile premium.
        </p>

    </div>

    <div class="gj-customizer-grid">

        <!-- BORDER RADIUS -->

        <div class="gj-control">

            <label>
                Angoli Avatar
            </label>

            <input
                type="range"
                min="0"
                max="80"
                value="32"
                id="radius-slider">

        </div>

        <!-- ZOOM -->

        <div class="gj-control">

            <label>
                Zoom Immagine
            </label>

            <input
                type="range"
                min="1"
                max="1.5"
                step="0.01"
                value="1"
                id="zoom-slider">

        </div>

        <!-- ROTATION -->

        <div class="gj-control">

            <label>
                Rotazione
            </label>

            <input
                type="range"
                min="-20"
                max="20"
                value="0"
                id="rotate-slider">

        </div>

        <!-- BRIGHTNESS -->

        <div class="gj-control">

            <label>
                Luminosità
            </label>

            <input
                type="range"
                min="50"
                max="150"
                value="100"
                id="brightness-slider">

        </div>

    </div>

    <!-- FILTERS -->

    <div class="gj-filter-row">

        <button onclick="setFilter('none')">
            Normale
        </button>

        <button onclick="setFilter('grayscale(1)')">
            B/N
        </button>

        <button onclick="setFilter('sepia(1)')">
            Vintage
        </button>

        <button onclick="setFilter('contrast(1.4)')">
            Contrast
        </button>

        <button onclick="setFilter('saturate(1.8)')">
            Pop
        </button>

    </div>

</div>

<style>

/* =========================
   CUSTOMIZER PANEL
========================= */

.gj-avatar-customizer{

    margin-top: 40px;

    background: #fff;

    border-radius: 32px;

    padding: 40px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.06);

}

/* HEADER */

.gj-customizer-header{

    margin-bottom: 35px;

}

.gj-customizer-header h2{

    font-size: 34px;

    font-weight: 900;

    color: var(--dark);

    margin-bottom: 10px;

}

.gj-customizer-header p{

    color: #666;

    line-height: 1.7;

}

/* GRID */

.gj-customizer-grid{

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 25px;

}

/* CONTROL */

.gj-control{

    background:
        #f7f9fc;

    padding: 25px;

    border-radius: 22px;

}

.gj-control label{

    display: block;

    margin-bottom: 15px;

    font-size: 13px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1px;

    color: var(--primary);

}

.gj-control input{

    width: 100%;

    cursor: pointer;

}

/* FILTERS */

.gj-filter-row{

    display: flex;

    flex-wrap: wrap;

    gap: 15px;

    margin-top: 35px;

}

.gj-filter-row button{

    border: none;

    background: var(--dark);

    color: white;

    padding: 14px 20px;

    border-radius: 14px;

    cursor: pointer;

    font-weight: 700;

    font-family: inherit;

    transition: var(--transition);

}

.gj-filter-row button:hover{

    transform:
        translateY(-4px);

    background:
        var(--primary);

}

/* MOBILE */

@media(max-width:700px){

    .gj-customizer-grid{

        grid-template-columns: 1fr;

    }

}

</style>

<script>

/* =========================
   AVATAR CUSTOMIZER
========================= */

const profileAvatar =
    document.getElementById(
        'profile-avatar'
    );

const radiusSlider =
    document.getElementById(
        'radius-slider'
    );

const zoomSlider =
    document.getElementById(
        'zoom-slider'
    );

const rotateSlider =
    document.getElementById(
        'rotate-slider'
    );

const brightnessSlider =
    document.getElementById(
        'brightness-slider'
    );

/* CURRENT FILTER */

let currentFilter = 'none';

/* =========================
   APPLY STYLES
========================= */

function applyAvatarStyle(){

    const radius =
        radiusSlider.value;

    const zoom =
        zoomSlider.value;

    const rotate =
        rotateSlider.value;

    const brightness =
        brightnessSlider.value;

    profileAvatar.style.borderRadius =
        radius + 'px';

    profileAvatar.style.transform = `
        scale(${zoom})
        rotate(${rotate}deg)
    `;

    profileAvatar.style.filter = `
        brightness(${brightness}%)
        ${currentFilter}
    `;

}

/* =========================
   FILTERS
========================= */

function setFilter(filter){

    currentFilter = filter;

    applyAvatarStyle();

}

/* =========================
   EVENTS
========================= */

radiusSlider.addEventListener(
    'input',
    applyAvatarStyle
);

zoomSlider.addEventListener(
    'input',
    applyAvatarStyle
);

rotateSlider.addEventListener(
    'input',
    applyAvatarStyle
);

brightnessSlider.addEventListener(
    'input',
    applyAvatarStyle
);

</script>
