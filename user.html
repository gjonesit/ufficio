     USER PROFILE HERO
========================= -->

<div class="gj-user-hero">

    <div class="gj-user-inner">

        <div class="gj-user-profile">

            <!-- AVATAR -->
            <img
                id="profile-avatar"
                src="https://i.pravatar.cc/300?img=12"
                alt="Avatar Utente">

            <div>

                <h1>
                    Gabriel<br>
                    Jones
                </h1>

                <p>
                    Area personale dell'Ufficio di Gabriel Jones.
                    Gestione contenuti, archivio digitale,
                    newsroom e progetti web.
                </p>

                <!-- =========================
                     AVATAR EDITOR
                ========================= -->

                <div class="gj-avatar-editor">

                    <input
                        type="text"
                        id="avatar-input"
                        placeholder="Incolla URL immagine profilo">

                    <button onclick="saveAvatar()">

                        <i class="fas fa-camera"></i>

                        Salva Avatar

                    </button>

                </div>

            </div>

        </div>

        <!-- STATUS -->

        <div class="gj-user-status">

            <span>Sessione</span>

            <strong>ONLINE</strong>

        </div>

    </div>

</div>
